version: 2
updates:
  # Dépendances Python d'AutoCRA
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Actions utilisées par la chaîne de livraison
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
