[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocra"
version = "0.1.0"
description = "Moteur de preuves pour le Cyber Resilience Act : lit le code d'un produit et prépare, pour chaque exigence, des preuves localisées à valider par un humain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "semgrep>=1.90",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
ia = ["anthropic>=1.0"]

[project.scripts]
autocra = "autocra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autocra = ["rules/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
